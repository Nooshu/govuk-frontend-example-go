version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Prefer exact bumps that match save-exact / pinned package.json entries.
    versioning-strategy: increase
    # Slow day-0 malicious publishes: wait a few days before opening version PRs.
    cooldown:
      default-days: 3
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 2
    groups:
      docs-tooling:
        patterns:
          - prettier
          - markdownlint*
      sass-tooling:
        patterns:
          - sass
          - "@parcel/*"
    # govuk-frontend is intentionally ungrouped — bump only via the Frontend upgrade playbook.

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
