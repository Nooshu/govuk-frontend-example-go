# Render Blueprint — https://render.com/docs/blueprint-spec
# Step-by-step: docs/deploying-on-render.md
#
# Native Go runtime includes Node/npm for the Frontend pin and Sass build.
# Sessions are in-memory (fine for a public example; not multi-instance durable).

services:
  - type: web
    name: govuk-frontend-example-go
    runtime: go
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /health
    buildCommand: ./scripts/render-build.sh
    startCommand: ./bin/server
    envVars:
      # Render often sets NODE_ENV=production; force demos on for the public blog example.
      # Set DEMOS_ENABLED=false (or remove this) if you want catalogue/previews off.
      - key: DEMOS_ENABLED
        value: "true"
      - key: NODE_VERSION
        value: "22"
      # Go's "tcp" listen on an unspecified address is an IPv6 socket ([::]),
      # which Render's port scan does not detect. 0.0.0.0 plus tcp4 is IPv4.
      - key: HOST
        value: "0.0.0.0"
