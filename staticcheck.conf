# Staticcheck configuration for this module.
# Invoked via `go tool staticcheck` / `npm run lint:go`.
# https://staticcheck.dev/docs/configuration/

checks = ["all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022", "-ST1023"]

# Prefer the module's go version from go.mod.
go = "module"

# Initialisms used in this codebase (GOV.UK / HTTP / CSRF / CSP).
initialisms = ["API", "ASCII", "CPU", "CSP", "CSRF", "CSS", "DNS", "EOF", "GUID", "HTML", "HTTP", "HTTPS", "ID", "IP", "JSON", "QPS", "RAM", "RPC", "SLA", "SMTP", "SQL", "SSH", "TCP", "TLS", "TTL", "UDP", "UI", "UID", "UUID", "URI", "URL", "UTF8", "VM", "XML", "XMPP", "XSRF", "XSS", "JS"]
