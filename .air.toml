# Optional live-reload for local Go development (https://github.com/air-verse/air).
# Install: go install github.com/air-verse/air@latest
# Run from the repo root after `npm run build:styles`, or wire your own watcher for Sass.
#
# This file is optional — `npm start` / `go run ./cmd/server` remain the supported paths.

root = "."
tmp_dir = "tmp"

[build]
  bin = "./tmp/server"
  cmd = "go build -o ./tmp/server ./cmd/server"
  delay = 500
  exclude_dir = ["assets", "tmp", "vendor", "node_modules", "dist", "coverage", ".git"]
  exclude_regex = ["_test\\.go"]
  include_ext = ["go", "gohtml", "tmpl"]
  kill_delay = "1s"
  send_interrupt = true
  stop_on_error = true

[log]
  time = false

[misc]
  clean_on_exit = true
